version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Atlantic/Canary"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Atlantic/Canary"
    open-pull-requests-limit: 5
